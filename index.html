<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Mi Salud</title>
  <meta name="description" content="Comidas, agua, pasos y ejercicios adaptados a ti">
  <meta name="theme-color" content="#1E4636">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Salud">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera">
    <p class="fecha" id="fecha"></p>
    <h1 id="titulo">Hoy</h1>
    <p class="saludo" id="saludo"></p>
  </header>

  <main id="vista" tabindex="-1"></main>

  <nav class="pestanas" aria-label="Secciones">
    <button type="button" data-vista="hoy" aria-current="page"><span aria-hidden="true">☀️</span>Hoy</button>
    <button type="button" data-vista="recetas"><span aria-hidden="true">🍲</span>Recetas</button>
    <button type="button" data-vista="ejercicios"><span aria-hidden="true">🧘‍♀️</span>Ejercicios</button>
    <button type="button" data-vista="progreso"><span aria-hidden="true">📈</span>Progreso</button>
  </nav>

  <dialog id="dialogo"></dialog>

  <script src="data.js"></script>
  <script src="dibujos.js"></script>
  <script src="app.js"></script>
</body>
</html>
